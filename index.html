<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula Lookout</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
<script>
  window.addEventListener('error', function(e) {
    document.body.style.background = '#111';
    document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;top:20px;left:20px;color:white;font:16px monospace;z-index:99">Sketch error: ' + String(e.message).replace(/</g,'&lt;') + '</div>');
  });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="sketch.js"></script>
</body>
</html>
