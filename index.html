<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nebula Lookout</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#222}
#scene{position:fixed;inset:0;overflow:hidden;background:#222}
#space{position:absolute;left:0;top:0;width:200%;height:50%;object-fit:cover;object-position:center;animation:orbit 90s linear infinite;max-width:none}
#space2{position:absolute;left:200%;top:0;width:200%;height:50%;object-fit:cover;object-position:center;animation:orbit 90s linear infinite;max-width:none}
@keyframes orbit{from{transform:translateX(0)}to{transform:translateX(-100%)}}
#horizon{position:absolute;left:0;right:0;top:50%;height:2px;background:#555;z-index:3}
#floor{position:absolute;left:-30%;right:-30%;top:50%;bottom:-20%;background:linear-gradient(#777,#555 35%,#333);transform:perspective(500px) rotateX(58deg);transform-origin:top center;z-index:2}
</style>
</head>
<body>
<div id="scene">
<img id="space" src="888.jpeg">
<img id="space2" src="888.jpeg">
<div id="floor"></div>
<div id="horizon"></div>
</div>
</body>
</html>
